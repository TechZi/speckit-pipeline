name: Validate

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate required files
        run: |
          test -f SKILL.md
          test -f agents/openai.yaml
          test -f references/gating-rules.md
          test -f README.md
          test -f LICENSE
          test -f CHANGELOG.md
          test -f CONTRIBUTING.md
          test -f core/pipeline.md
          test -f core/adapters.json
          test -f core/state-schema.json
          test -f core/handoff.md
          test -x bin/speckit-pipeline
          test -x install.sh
          test -x test/run-tests.sh
          test -f templates/codex/SKILL.md
          test -f templates/claude/SKILL.md
          test -f templates/qoder/SKILL.md
          test -f templates/cursor/SKILL.md

      - name: Validate skill frontmatter
        run: |
          grep -q '^---$' SKILL.md
          grep -q '^name: speckit-pipeline$' SKILL.md
          grep -q '^description:' SKILL.md

      - name: Validate JSON files
        run: |
          python3 -m json.tool core/adapters.json >/dev/null
          python3 -m json.tool core/state-schema.json >/dev/null

      - name: Validate openai metadata
        run: |
          grep -q 'display_name:' agents/openai.yaml
          grep -q 'short_description:' agents/openai.yaml
          grep -q 'default_prompt:' agents/openai.yaml

      - name: Validate CLI help
        run: |
          bin/speckit-pipeline --help

      - name: Run shell tests
        run: |
          bash test/run-tests.sh
